[package]
name = "spotify-widget"
version = "0.1.0"
description = "Spotify Floating Mini-Player & Lyrics Overlay"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
